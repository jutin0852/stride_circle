name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - work
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/02-friends-step-challenge/app

jobs:
  verify:
    name: PR verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/02-friends-step-challenge/app/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Run fast verification
        run: npm run verify:fast
