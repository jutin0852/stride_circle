    const landed = land(s);
    if (t < landed) return null;
    const name = nameOf(s), p = PRINTS[name];
    const sweep = easeInOutQuint(prog(t, SWEEP_START, SWEEP_END));
    const gather = easeInOut(prog(t, SWEEP_START + 0.12, SWEEP_END));
    const since = easeOut(prog(t, landed, landed + 0.22));
    const r = ring(slotAngle(s) + SWEEP_TURN * sweep, name, 1 + 0.12 * (1 - since), 0);
    const ta = p.a + 360 * Math.round((r.a - p.a) / 360);
    const trailOp = lerp(1, TRAIL_OPACITY, since);
    const isLogo = s === 0 || s === SLOTS - 1;
    return { name, x: lerp(r.x, p.x * LOGO_PX, gather), y: lerp(r.y, p.y * LOGO_PX, gather),
             a: lerp(r.a, ta, gather), k: lerp(r.k, p.k * LOGO_PX, gather),
             op: isLogo ? lerp(trailOp, 1, sweep) : trailOp * (1 - gather) };
  }
  function foot(t, f) {
    if (t >= SWEEP_START) return null;
    const stance = -0.5; let from = stance, to = stance, swing = 1;
    for (let s = f === -1 ? 0 : 1; s < STEPS; s += 2) {
      if (t < start[s]) break;
      from = s < 2 ? stance : s - 2; to = s;
      swing = clamp((t - start[s]) / (dur[s] * SWING));
      if (swing < 1) break;
    }
    const lifted = swing < 1 ? Math.sin(Math.PI * swing) : 0;
    const intro = easeOut(prog(t, 0, WALK_START));
    const name = f === -1 ? 'WA' : 'KA';
    const r = ring(lerp(slotAngle(from), slotAngle(to), easeInOut(swing)), name, (1 + LIFT * lifted) * lerp(0.82, 1, intro), 1 - intro, (o.swing || 0) * lifted);
    return { name, ...r, op: intro };
  }
  // Guide line: grows behind the runner from the top and closes on the last landing, then fades.
  function guide(t) {
    if (!o.guide) return null;
    // Follow the runner: the line ends at the most recent landed print, never ahead of the feet.
    let progress = 0;
    for (let s = 0; s < STEPS; s++) if (t >= land(s)) progress = s / SLOTS;
    const next = STEPS - 1 > progress * SLOTS ? Math.round(progress * SLOTS) + 1 : STEPS - 1;
    if (t >= land(0) && next < STEPS && t < land(next)) {
      const prev = Math.round(progress * SLOTS);
      progress = (prev + easeInOut(prog(t, land(prev), land(next)))) / SLOTS;
    }
    progress = Math.min(1, progress);
    const fade = 1 - prog(t, SWEEP_START, SWEEP_START + 0.25);
    return { progress, op: 0.35 * fade * prog(t, WALK_START, WALK_START + 0.15) };
  }
  return { SLOTS, trail, foot, guide };
}
const settleScale = t => { const s = prog(t, SWEEP_END, SETTLE_END); return 1 + 0.032 * Math.sin(Math.PI * easeOut(s)) * (1 - s * 0.4); };

const grid = document.getElementById('grid');
const stages = OPTIONS.map(o => {
  const fig = document.createElement('figure');
  fig.innerHTML = `<div class="phone"><svg viewBox="0 0 390 844"><g></g></svg></div><figcaption><b>${o.label}</b>${o.note}</figcaption>`;
  grid.append(fig);
  return { o, tl: timeline(o), g: fig.querySelector('g') };
});
const use = p => `<use href="#print${p.name}" fill="#FFFFFF" opacity="${p.op.toFixed(3)}" transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${p.a.toFixed(2)}) scale(${p.k.toFixed(4)})"/>`;
function frame(t) {
  for (const { tl, g } of stages) {
    let out = '';
    const gd = tl.guide(t);
    if (gd && gd.op > 0) {
      const C = 2 * Math.PI * RING;
      out += `<circle r="${RING}" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="${gd.op.toFixed(3)}"
        stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - gd.progress)).toFixed(2)}" transform="rotate(-90)"/>`;
    }
    for (let s = 0; s < tl.SLOTS; s++) { const p = tl.trail(t, s); if (p && p.op > 0.001) out += use(p); }
    for (const f of [1, -1]) { const p = tl.foot(t, f); if (p && p.op > 0.001) out += use(p); }
    g.setAttribute('transform', `translate(195 422) scale(${settleScale(t).toFixed(4)})`);
    g.innerHTML = out;
  }
}
const scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
let startTs = null, speed = 1, frozen = FROZEN;
function tick(ts) {
  if (frozen !== null) { frame(frozen); scrub.value = frozen; clock.textContent = frozen.toFixed(2) + 's'; return; }
  if (startTs === null) startTs = ts;
  const t = Math.min(END + 0.15, (ts - startTs) / 1000 * speed);
  frame(t); scrub.value = t; clock.textContent = t.toFixed(2) + 's';
  if (t < END + 0.15) requestAnimationFrame(tick);
}
document.getElementById('replay').onclick = () => { frozen = null; startTs = null; requestAnimationFrame(tick); };
document.getElementById('slow').onclick = e => { speed = speed === 1 ? 0.25 : 1; e.target.textContent = 'Slow: ' + (speed === 1 ? 'off' : 'on'); };
document.getElementById('freeze').onclick = () => { frozen = 1.58; requestAnimationFrame(tick); };
scrub.oninput = () => { frozen = parseFloat(scrub.value); requestAnimationFrame(tick); };
requestAnimationFrame(tick);
</script>
</body>
